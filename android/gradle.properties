org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
org.gradle.java.home=/opt/homebrew/opt/openjdk@17/libexec/openjdk.jdk/Contents/Home
# 16 KB page-size support: rive_common compiles librive_text.so from source with
# CMake and defaults to NDK 25 (4 KB ELF alignment) unless told otherwise. NDK r28+
# links native libraries with 16 KB-aligned LOAD segments by default. Keep this in
# sync with android.ndkVersion in app/build.gradle.kts.
rive.ndk.version=29.0.14206865
# NDK r28+ dropped support for API < 21. rive_common's library module still declares
# minSdkVersion 19 for its own native build; this app's minSdk is 23, so no device
# below 21 can install it. Build the plugin's native code against API 21 instead of
# failing configuration (AGP-documented setting, see CXX1110).
android.ndk.suppressMinSdkVersionError=21
